# Lægger kittet ud som en ZIP-fil under Releases, hver gang versionsnummeret (startkit/VERSION) er nyt.
# README linker til den fil, og GitHub tæller, hvor mange gange den bliver hentet.
# Tælleren ligger hos GitHub. Kittet selv sender ingenting.
name: Udgivelse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  udgiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Find versionen, og se, om den allerede er udgivet
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(head -n 1 startkit/VERSION | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "findes=ja" >> "$GITHUB_OUTPUT"; else echo "findes=nej" >> "$GITHUB_OUTPUT"; fi
      - name: Kør testene
        if: steps.v.outputs.findes == 'nej'
        run: node tests/run.js
      - name: Pak kittet
        if: steps.v.outputs.findes == 'nej'
        run: |
          mkdir -p pakke/ai-coding-starter-kit
          cp -r startkit installer.cmd install-english.cmd installer-claude.cmd install-claude-english.cmd install.ps1 README.md README.da.md CHANGELOG.md CHANGELOG.da.md TEACHING.md UNDERVISNING.md LICENSE pakke/ai-coding-starter-kit/
          cd pakke && zip -q -r ../ai-coding-starter-kit.zip ai-coding-starter-kit
      - name: Læg udgivelsen ud
        if: steps.v.outputs.findes == 'nej'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" ai-coding-starter-kit.zip --title "${{ steps.v.outputs.version }}" --notes "Download ai-coding-starter-kit.zip below, unzip it, and double-click the installer for your tool. For Codex that is install-english.cmd (English) or installer.cmd (Danish). For Claude Code it is install-claude-english.cmd (English) or installer-claude.cmd (Danish). What is new is in CHANGELOG.md."
